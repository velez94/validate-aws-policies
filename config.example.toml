# Example configuration file for validate-aws-policies
# Copy this file to config.toml and customize as needed

# Legacy key names (directory_policies_path, upload_report, zip_reports) are still accepted.

# AWS profile to use for Access Analyzer API
profile = "my-aws-profile"

# S3 bucket name for uploading reports
bucket_name = "my-reports-bucket"

# Directory containing policy files (JSON format)
policies_path = "./policies"

# Policy type: identity (default), resource, scp or rcp
policy_type = "identity"

# Enable report upload to S3
upload = false

# Create ZIP archive of reports
zip = false

# CI/CD mode
ci = false

# Logging level (DEBUG, INFO, WARNING, ERROR)
log_level = "INFO"

# Also search sub-directories
recursive = false

# Language of finding messages (DE EN ES FR IT JA KO PT_BR ZH_CN ZH_TW)
locale = "EN"

# Failure handling: stop at the first ERROR (default), or validate everything and
# exit 1 at the end. fail_on implies continue_on_error.
continue_on_error = false
# fail_on = "error"    # error, security-warning, warning, suggestion, none

