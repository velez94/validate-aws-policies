site_name: 'AWS Validate Policies Tool'
site_description: 'Validate AWS policies using IAM Access Analyzer API'
site_author: 'Alejandro Velez'
repo_url: https://github.com/velez94/validate-aws-policies
repo_name: velez94/validate-aws-policies
copyright: Copyright &copy; 2026 Alejandro Velez. Apache License 2.0
site_url: https://velez94.github.io/validate-aws-policies/
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Policy Types & Custom Checks: access-analyzer-features.md
  - Infrastructure as Code: iac.md
  - Examples: examples.md
  - CI/CD:
      - AWS CodeBuild: codebuild.md
      - JUnit XML Report: JUNIT_XML_REPORT.md
  - API Reference: api.md
  - Development: development.md
  - Changelog: changelog.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  variant: modern
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - toc.follow

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/velez94/validate-aws-policies
      name: Source code on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/validate-aws-policies/
      name: validate-aws-policies on PyPI
